<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Admission Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="background-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
</div>

<div class="chat-wrapper">
    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">
                <div class="avatar-inner">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a4 4 0 0 1 4 4c0 1.5-.8 2.8-2 3.5V11h4a4 4 0 0 1 4 4 4 4 0 0 1-4 4h-1.5c-.5 1-1.3 1.8-2.3 2.3-.7.3-1.4.7-2 1.2-.6-.5-1.3-.9-2-1.2-1-.5-1.8-1.3-2.3-2.3H6a4 4 0 0 1-4-4 4 4 0 0 1 4-4h4V9.5A4 4 0 0 1 8 6a4 4 0 0 1 4-4z"/>
                        <circle cx="12" cy="7" r="3"/>
                    </svg>
                </div>
                <span class="status-dot"></span>
            </div>
            <div class="header-info">
                <h1>Admission Assistant</h1>
                <p>Ask me anything about admissions</p>
            </div>
        </div>

        <div class="chat-messages" id="chatbox">
            <div class="message bot-message">
                <div class="message-content">
                    <p>Hello! 👋 Welcome to the University Admission Assistant.</p>
                    <p>I'm here to help you with any questions about:</p>
                    <ul>
                        <li>Admission requirements</li>
                        <li>Programs offered</li>
                        <li>Fee structure</li>
                        <li>Application deadlines</li>
                    </ul>
                    <p>How can I assist you today?</p>
                </div>
                <div class="message-time">Just now</div>
            </div>
        </div>

        <div class="chat-input-container">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Type your question here..." autocomplete="off">
                <button onclick="sendMessage()" class="send-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    
    <div class="decoration">
        <div class="decoration-ring"></div>
        <div class="decoration-ring ring-2"></div>
    </div>
</div>

<script>
function sendMessage() {
    var userText = document.getElementById("userInput").value.trim();
    if (!userText) return;

    var chatbox = document.getElementById("chatbox");
    
    // Add user message
    var userMessage = document.createElement('div');
    userMessage.className = 'message user-message';
    userMessage.innerHTML = `
        <div class="message-content">
            <p>${userText}</p>
        </div>
        <div class="message-time">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
    `;
    chatbox.appendChild(userMessage);
    
    // Clear input
    document.getElementById("userInput").value = "";
    
    // Scroll to bottom
    chatbox.scrollTop = chatbox.scrollHeight;
    
    // Show typing indicator
    var typingIndicator = document.createElement('div');
    typingIndicator.className = 'message bot-message typing-indicator';
    typingIndicator.innerHTML = `
        <div class="message-content">
            <div class="typing-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    `;
    chatbox.appendChild(typingIndicator);
    chatbox.scrollTop = chatbox.scrollHeight;

    fetch("/get", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "msg=" + encodeURIComponent(userText)
    })
    .then(response => response.json())
    .then(data => {
        // Remove typing indicator
        chatbox.removeChild(typingIndicator);
        
        // Add bot response
        var botMessage = document.createElement('div');
        botMessage.className = 'message bot-message';
        botMessage.innerHTML = `
            <div class="message-content">
                <p>${data.reply}</p>
            </div>
            <div class="message-time">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
        `;
        chatbox.appendChild(botMessage);
        
        // Scroll to bottom
        chatbox.scrollTop = chatbox.scrollHeight;
    })
    .catch(error => {
        chatbox.removeChild(typingIndicator);
        var errorMessage = document.createElement('div');
        errorMessage.className = 'message bot-message';
        errorMessage.innerHTML = `
            <div class="message-content error">
                <p>Sorry, something went wrong. Please try again.</p>
            </div>
        `;
        chatbox.appendChild(errorMessage);
        chatbox.scrollTop = chatbox.scrollHeight;
    });
}

// Allow Enter key to send
document.getElementById("userInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
