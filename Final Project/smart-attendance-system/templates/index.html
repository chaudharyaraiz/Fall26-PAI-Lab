<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🤖 Smart Attendance System</h1>
        
        <div class="controls">
            <button onclick="startAttendance()" class="btn start">Start Attendance</button>
            <button onclick="stopAttendance()" class="btn stop">Stop & Close Camera</button>
        </div>

        <div class="video-container">
            <img id="video" src="" alt="Camera Feed">
        </div>

        <div class="dashboard">
            <a href="/present_students" class="btn dashboard-btn">👥 View Present Students</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
